minimum_prek_version = "0.4.5"
default_stages = ["pre-commit"]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    language = "system",
    entry = "cargo fmt --all -- --check",
    files = "\\.rs$|Cargo\\.toml$",
    pass_filenames = false,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    language = "system",
    entry = "cargo clippy --workspace --all-targets -- -D warnings",
    files = "\\.rs$|Cargo\\.toml$|Cargo\\.lock$",
    pass_filenames = false,
  },
]
